<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆锚 · Memory Anchor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0eefe', 200: '#bbdcfd',
              300: '#7ec0fc', 400: '#3a9ff8', 500: '#1280eb',
              600: '#0564c8', 700: '#064fa0', 800: '#094484', 900: '#0d3a6e'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- KaTeX: 数学公式渲染 (CSS + JS), 必须在本页其它脚本前加载 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- markdown-it -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.2/dist/markdown-it.min.js"></script>
  <!-- highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <!-- KaTeX JS (公式渲染引擎) -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors">

<!-- 顶部导航 -->
<header class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-700">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-4">
    <a href="/" class="flex items-center gap-2 shrink-0">
      <svg class="w-7 h-7 text-brand-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2 L4 6 v6 c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10 V6 z"/>
        <path d="M9 12 l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-bold text-lg">记忆锚</span>
      <span class="text-xs text-slate-400 hidden sm:inline">Memory Anchor</span>
    </a>
    <nav class="flex-1 flex items-center gap-1 ml-4" id="topNav">
      <button data-tab="records" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span class="inline-flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          记录
        </span>
      </button>
      <button data-tab="review" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition relative">
        <span class="inline-flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9M3 4v5h5"/></svg>
          复习
        </span>
        <span id="dueBadge" class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center hidden">0</span>
      </button>
      <button data-tab="stats" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span class="inline-flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 14l4-4 4 4 5-5"/></svg>
          统计
        </span>
      </button>
      <button data-tab="settings" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span class="inline-flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          设置
        </span>
      </button>
    </nav>
    <div class="flex items-center gap-2">
      <button id="quickNewBtn" title="快速新增 (Ctrl+N)" class="px-3 py-1.5 text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-lg transition flex items-center gap-1.5">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hidden sm:inline">新增</span>
      </button>
      <button id="themeToggle" title="切换主题" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg class="w-4 h-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="w-4 h-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- 主内容区 -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  <!-- Toast 容器 -->
  <div id="toastContainer" class="fixed top-16 right-4 z-50 flex flex-col gap-2"></div>

  <!-- 记录 Tab -->
  <section id="tab-records" class="tab-panel"></section>
  <!-- 复习 Tab -->
  <section id="tab-review" class="tab-panel hidden"></section>
  <!-- 统计 Tab -->
  <section id="tab-stats" class="tab-panel hidden"></section>
  <!-- 设置 Tab -->
  <section id="tab-settings" class="tab-panel hidden"></section>
</main>

<!-- 全局抽屉容器 (用于新增/编辑/详情) -->
<div id="drawerRoot"></div>

<!-- 脚本 -->
<script src="/static/js/utils.js"></script>
<script src="/static/js/records.js"></script>
<script src="/static/js/review.js"></script>
<script src="/static/js/stats.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/markdown_editor.js"></script>
<script src="/static/js/annotations.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
